<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nodes Canvas - Launcher</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --accent-green: #00dc82;
            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 220, 130, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(59, 130, 246, 0.05) 0%, transparent 50%);
        }

        .launcher-container {
            width: 100%;
            max-width: 800px;
            padding: 40px;
            text-align: center;
        }

        .logo-container {
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease-out;
        }

        .logo-container h1 {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -0.05em;
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .logo-container p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .modes-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .mode-card {
            background-color: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px 30px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .mode-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .mode-card.local:hover {
            border-color: rgba(0, 220, 130, 0.4);
            box-shadow: 0 20px 40px rgba(0, 220, 130, 0.1);
        }

        .mode-card.cloud:hover {
            border-color: rgba(59, 130, 246, 0.4);
            box-shadow: 0 20px 40px rgba(59, 130, 246, 0.1);
        }

        .mode-icon {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 1.5rem;
            color: white;
        }

        .mode-card.local .mode-icon {
            background: linear-gradient(135deg, #059669, #10b981);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.2);
        }

        .mode-card.cloud .mode-icon {
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.2);
        }

        .mode-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .mode-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Decorative glows */
        .glow {
            position: absolute;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, transparent 70%);
            border-radius: 50%;
            top: -50px;
            right: -50px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        
        .mode-card.local:hover .glow {
            background: radial-gradient(circle, rgba(0, 220, 130, 0.15) 0%, transparent 70%);
            opacity: 1;
        }
        
        .mode-card.cloud:hover .glow {
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, transparent 70%);
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="launcher-container">
        <div class="logo-container">
            <h1>Nodes Canvas</h1>
            <p>Select your workspace environment</p>
        </div>

        <div class="modes-grid">
            <!-- Local Standalone Mode -->
            <a href="dashboard_local.html" class="mode-card local" onclick="setMode(true)">
                <div class="glow"></div>
                <div class="mode-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                    </svg>
                </div>
                <h3 class="mode-title">Local Standalone</h3>
                <p class="mode-desc">Work directly with files on your local hard drive. Fast and private, without relying on cloud credentials.</p>
            </a>

            <!-- Cloud Mode -->
            <a href="dashboard_cloud.html" class="mode-card cloud" onclick="setMode(false)">
                <div class="glow"></div>
                <div class="mode-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
                        <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
                        <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
                    </svg>
                </div>
                <h3 class="mode-title">Cloud Environment</h3>
                <p class="mode-desc">Collaborate and sync to Xano database. Login seamlessly to access your online workspaces.</p>
            </a>
        </div>
    </div>

    <script>
        function setMode(isLocal) {
            localStorage.setItem('nc_standalone_mode', isLocal ? 'true' : 'false');
        }
        
        // Auto-clear active board variable so returning here wipes session cache properly
        localStorage.removeItem('nc_active_board_name');
    </script>
</body>
</html>
