<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nodes Canvas - Cloud Dashboard</title>
    <link rel="stylesheet" href="./css/standalone.css">
    <style>
        .hero-badge.cloud {
            color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
            border-color: rgba(59, 130, 246, 0.2);
        }
    </style>
</head>
<body>

<div class="dashboard">

    <!-- Header -->
    <header class="dash-header">
        <div class="logo">
            <div class="logo-icon" style="background: linear-gradient(135deg, #2563eb, #3b82f6);">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                    <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
                    <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
                    <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
                </svg>
            </div>
            <div class="logo-text">
                <h1>Nodes Canvas Studio</h1>
                <span>Cloud Mode · v1.5</span>
            </div>
        </div>
        <div class="dash-header-actions">
            <button class="btn btn-ghost btn-sm" onclick="window.location.href='index.html'">
                ← Back to Mode Select
            </button>
            <button class="btn btn-secondary btn-sm" id="btn-login-cloud">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                    <polyline points="10 17 15 12 10 7" />
                    <line x1="15" y1="12" x2="3" y2="12" />
                </svg>
                Enter Cloud Editor
            </button>
        </div>
    </header>

    <!-- ── Hero ── -->
    <section class="hero visible" id="hero">
        <div class="hero-badge cloud">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg>
            Cloud Environment
        </div>
        <h2>Collaborate in<br>the Cloud</h2>
        <p>Save your boards to Xano, load remote libraries, and share functions online.</p>
        <div class="hero-actions">
            <button class="btn btn-primary" onclick="enterCloud()" style="background: linear-gradient(135deg, #2563eb, #3b82f6); border: none; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);">
                Open Cloud Canvas
            </button>
        </div>
    </section>

</div>

<script>
function enterCloud() {
    localStorage.setItem('nc_standalone_mode', 'false');
    window.location.href = 'editor_cloud.html';
}
</script>

</body>
</html>
